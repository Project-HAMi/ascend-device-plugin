# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

on:
  push:
    branches: [ "main" ]
    tags:
    - v[0-9]+.[0-9]+.[0-9]+.[0-9]+
    - v[0-9]+.[0-9]+.[0-9]+
    - v[0-9]+.[0-9]+
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.26.2"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
    - name: checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: go tidy
      env:
        GOTOOLCHAIN: auto
      run: |
        find mind-cluster/component -maxdepth 1 -type d ! -name "npu-exporter" ! -name "ascend-common"  ! -name "component" -exec rm -rf {} \;
        go mod download github.com/Project-HAMi/HAMi
        go get github.com/Project-HAMi/ascend-device-plugin/internal/server
        go get huawei.com/npu-exporter
        go get huawei.com/npu-exporter/utils/logger@v0.0.0-00010101000000-000000000000
        go mod tidy
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      env:
        GOTOOLCHAIN: auto
      with:
        version: v2.1.0
        install-mode: goinstall
        args: --timeout=10m

  test:
    name: Unit test
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Run tests
      run: make test
    - name: Upload coverage to Codecov
      if: ${{ github.repository == 'Project-HAMi/ascend-device-plugin' }}
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_output/coverage/coverage.out
        flags: unittests
        fail_ci_if_error: false
        verbose: true

  build-vnpu:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build with the core's official CANN 8.5.2 Dockerfile
      run: make build-in-docker PLATFORM=linux/arm64 OUT_DIR=../artifacts
      working-directory: ./libvnpu
    - name: Prepare artifacts for upload
      run: |
        test -s ./artifacts/libvnpu.so
        test -s ./artifacts/build-info.json
        (cd ./artifacts && sha256sum -c SHA256SUMS)
        echo "/hami-vnpu-core/libvnpu.so" > ./artifacts/ld.so.preload
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        if-no-files-found: error
        path: ./artifacts/*

  build-images:
    env:
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'projecthami/ascend-device-plugin' }}
      DOCKER_BUILD_RECORD_UPLOAD: false
    needs: [ "build-vnpu", "test" ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        submodules: true

    - name: Verify native architecture
      env:
        EXPECTED_MACHINE: ${{ matrix.machine }}
      run: test "$(uname -m)" = "$EXPECTED_MACHINE"

    - name: Download VNPU artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./lib/hami-vnpu-core/

    - name: Verify VNPU artifacts
      working-directory: ./lib/hami-vnpu-core
      run: |
        test -s libvnpu.so
        test -s ld.so.preload
        sha256sum -c SHA256SUMS

    - name: Docker Login
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      uses: docker/login-action@v3.6.0
      with:
        username: ${{ secrets.DOCKERHUB_TOKEN }}
        password: ${{ secrets.DOCKERHUB_PASSWD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build single-platform image
      id: image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        cache-from: type=gha,scope=plugin-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=plugin-${{ matrix.arch }}
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
        build-args: |
          BASE_IMAGE=ubuntu:20.04
          GO_VERSION=${{ env.GO_VERSION }}
          VERSION=${{ github.head_ref || github.ref_name }}-${{ github.sha }}

    - name: Save image digest
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      env:
        DIGEST: ${{ steps.image.outputs.digest }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload image digest
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      uses: actions/upload-artifact@v4
      with:
        name: image-digest-${{ matrix.arch }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Keep the existing build check name and fail if either architecture failed.
  build:
    if: ${{ always() }}
    needs: [ "build-images" ]
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'projecthami/ascend-device-plugin' }}
    steps:
    - name: Require both native builds
      env:
        BUILD_RESULT: ${{ needs.build-images.result }}
      run: test "$BUILD_RESULT" = success

    - name: Download image digests
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      uses: actions/download-artifact@v4
      with:
        pattern: image-digest-*-${{ github.run_attempt }}
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - name: Docker Login
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      uses: docker/login-action@v3.6.0
      with:
        username: ${{ secrets.DOCKERHUB_TOKEN }}
        password: ${{ secrets.DOCKERHUB_PASSWD }}

    - name: Set up Docker Buildx
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      uses: docker/setup-buildx-action@v3

    - name: Publish and verify multi-platform manifest
      if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
      working-directory: ${{ runner.temp }}/digests
      run: |
        set -euo pipefail
        tag=latest
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          tag="${GITHUB_REF#refs/tags/}"
        fi
        digests=(*)
        ((${#digests[@]} == 2))
        sources=()
        for digest in "${digests[@]}"; do
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          sources+=("${IMAGE_NAME}@sha256:${digest}")
        done
        docker buildx imagetools create --tag "${IMAGE_NAME}:${tag}" "${sources[@]}"
        docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" --raw > "$RUNNER_TEMP/image-index.json"
        jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/image-index.json"

  cleanup-digests:
    needs: build
    if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
    - name: Remove this run's temporary digest artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
          --jq ".artifacts[] | select(.name == \"image-digest-amd64-$RUN_ATTEMPT\" or .name == \"image-digest-arm64-$RUN_ATTEMPT\") | .id" \
          | while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
