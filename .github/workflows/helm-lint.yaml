name: Helm Lint

on:
  pull_request:
    branches:
      - main

env:
  HELM_VERSION: "v3.20.0"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - name: Detect Helm changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            helm:
              - 'charts/ascend-device-plugin/**'
              - 'Makefile'
              - '.github/workflows/helm-lint.yaml'
              - '.github/workflows/build-helm-release.yaml'

  lint-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require chart version bump
        shell: bash
        run: |
          set -euo pipefail

          chart_path="charts/ascend-device-plugin"
          base_sha="${{ github.event.pull_request.base.sha }}"
          current_version="$(awk '$1 == "version:" { print $2; exit }' "${chart_path}/Chart.yaml")"

          if [[ -z "${current_version}" ]]; then
            echo "failed to resolve current chart version" >&2
            exit 1
          fi

          if git diff --quiet "${base_sha}" HEAD -- "${chart_path}"; then
            echo "No chart content changes."
            exit 0
          fi

          if ! git cat-file -e "${base_sha}:${chart_path}/Chart.yaml" 2>/dev/null; then
            echo "Chart is new; current version is ${current_version}."
            exit 0
          fi

          previous_version="$(git show "${base_sha}:${chart_path}/Chart.yaml" | awk '$1 == "version:" { print $2; exit }')"
          echo "Chart version: ${previous_version:-<none>} -> ${current_version}"

          if [[ -z "${previous_version}" || "${previous_version}" == "${current_version}" ]]; then
            echo "Chart content changed without a Chart.yaml version bump" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up helm-docs
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: v1.14.2

      - name: Run Helm chart verification
        run: |
          make verify-helm-chart
          make verify-helm-release-path

  helm-lint-required:
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-test
    if: always()
    steps:
      - name: Check Helm workflow result
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Helm change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.helm }}" != "true" ]]; then
            echo "No Helm-relevant changes."
            exit 0
          fi

          if [[ "${{ needs.lint-test.result }}" != "success" ]]; then
            echo "Helm verification did not complete successfully: ${{ needs.lint-test.result }}"
            exit 1
          fi
