apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ascend-device-plugin.daemonSetName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "ascend-device-plugin.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
{{- include "ascend-device-plugin.selectorLabels" . | nindent 6 }}
      hami.io/webhook: ignore
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
{{- include "ascend-device-plugin.labels" . | nindent 8 }}
        hami.io/webhook: ignore
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: {{ include "ascend-device-plugin.serviceAccountName" . }}
      containers:
        - image: {{ include "ascend-device-plugin.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: device-plugin
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          args:
{{ toYaml .Values.daemonSet.args | nindent 12 }}
          ports:
            - name: monitorport
              containerPort: 9395
              protocol: TCP
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: pod-resource
              mountPath: /var/lib/kubelet/pod-resources
            - name: hiai-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: host-sbin
              mountPath: /usr/local/sbin
              readOnly: true
            - name: log-path
              mountPath: /var/log/mindx-dl/devicePlugin
            - name: tmp
              mountPath: /tmp
            - name: hami-shared-region
              mountPath: /usr/local/hami-shared-region
            - name: hami-vnpu-core
              mountPath: /usr/local/hami-vnpu-core
            - name: enpu-config
              mountPath: {{ .Values.enpu.configRoot }}
            {{- if and .Values.enpu.managerConfigRoot (ne .Values.enpu.managerConfigRoot .Values.enpu.configRoot) }}
            - name: enpu-manager-config
              mountPath: {{ .Values.enpu.managerConfigRoot }}
            {{- end }}
            - name: enpu-runtime
              mountPath: /usr/local/enpu/vcann-rt
            - name: ascend-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
              readOnly: true
            - name: ascend-node-config
              mountPath: /node-config.yaml
              subPath: node-config.yaml
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ENPU_RUNTIME_PATH
              value: {{ .Values.enpu.runtimePath | quote }}
            - name: ENPU_MONITOR_PATH
              value: {{ .Values.enpu.monitorPath | quote }}
            - name: ENPU_PRELOAD_PATH
              value: {{ .Values.enpu.preloadPath | quote }}
            - name: ENPU_SYSTEMD_DETECT_VIRT_PATH
              value: {{ .Values.enpu.systemdDetectVirtPath | quote }}
            - name: ENPU_CONFIG_ROOT
              value: {{ .Values.enpu.configRoot | quote }}
            - name: ENPU_SCHEDULING_POLICY
              value: {{ .Values.enpu.defaultPolicy | quote }}
            - name: ENPU_EXPOSE_ALL_DEVICES
              value: {{ .Values.enpu.exposeAllDevices | quote }}
            {{- if .Values.enpu.managerURL }}
            - name: ENPU_MANAGER_URL
              value: {{ .Values.enpu.managerURL | quote }}
            {{- end }}
            {{- if .Values.enpu.managerConfigRoot }}
            - name: ENPU_MANAGER_CONFIG_ROOT
              value: {{ .Values.enpu.managerConfigRoot | quote }}
            {{- end }}
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resource
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: hiai-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: host-sbin
          hostPath:
            path: /usr/local/sbin
            type: DirectoryOrCreate
        - name: log-path
          hostPath:
            path: /var/log/mindx-dl/devicePlugin
            type: DirectoryOrCreate
        - name: tmp
          hostPath:
            path: /tmp
        - name: hami-shared-region
          hostPath:
            path: /usr/local/hami-shared-region
            type: DirectoryOrCreate
        - name: hami-vnpu-core
          hostPath:
            path: /usr/local/hami-vnpu-core
            type: DirectoryOrCreate
        - name: enpu-config
          hostPath:
            path: {{ .Values.enpu.configRoot }}
            type: DirectoryOrCreate
        {{- if and .Values.enpu.managerConfigRoot (ne .Values.enpu.managerConfigRoot .Values.enpu.configRoot) }}
        - name: enpu-manager-config
          hostPath:
            path: {{ .Values.enpu.managerConfigRoot }}
            type: DirectoryOrCreate
        {{- end }}
        - name: enpu-runtime
          hostPath:
            path: /usr/local/enpu/vcann-rt
            type: DirectoryOrCreate
        - name: ascend-config
          configMap:
            name: {{ include "ascend-device-plugin.deviceConfigMapName" . }}
        - name: ascend-node-config
          configMap:
            name: {{ include "ascend-device-plugin.nodeConfigMapName" . }}
      nodeSelector:
{{- toYaml .Values.nodeSelector | nindent 8 }}
